<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sonora — Music Player</title>
  <meta
    name="description"
    content="A modern responsive music player built with HTML, CSS and JavaScript."
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Background decoration -->
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <!-- Top Navigation -->
  <header class="topbar">
    <a href="#" class="brand" id="brandHome">
      <span class="brand-mark">S</span>
      <span>SONORA</span>
    </a>

    <div class="top-actions">
      <div class="search-box">
        <span>⌕</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search songs..."
          autocomplete="off"
        />
        <kbd>/</kbd>
      </div>

      <button
        class="icon-btn"
        id="themeBtn"
        type="button"
        aria-label="Toggle theme"
        title="Toggle theme"
      >
        ☼
      </button>
    </div>
  </header>


  <!-- Main -->
  <main class="main-container">

    <!-- Hero Player -->
    <section class="hero">

      <div class="art-area">

        <div class="art-shadow"></div>

        <div class="album-wrap" id="albumWrap">
          <img
            id="mainCover"
            src="assets/images/cover-1.jpg"
            alt="Album cover"
          />
        </div>

        <div class="playing-bars" id="visualizer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>


      <div class="player-info">

        <div class="eyebrow">
          <span class="live-dot"></span>
          NOW PLAYING
        </div>

        <div class="title-row">
          <div>
            <h1 id="songTitle">Golden Hour</h1>
            <p id="artistName">Sonora Sessions</p>
          </div>

          <button
            class="favorite-btn"
            id="favoriteBtn"
            type="button"
            aria-label="Add to favorites"
          >
            ♡
          </button>
        </div>

        <p class="song-description" id="songDescription">
          Warm & dreamy
        </p>


        <!-- Progress -->
        <div class="progress-area">

          <span id="currentTime">0:00</span>

          <input
            type="range"
            id="progressBar"
            min="0"
            max="100"
            value="0"
            step="0.1"
          />

          <span id="duration">0:00</span>

        </div>


        <!-- Controls -->
        <div class="main-controls">

          <button
            class="control-btn small"
            id="shuffleBtn"
            type="button"
            title="Shuffle"
          >
            ⤨
          </button>

          <button
            class="control-btn"
            id="prevBtn"
            type="button"
            title="Previous"
          >
            ⏮
          </button>

          <button
            class="play-btn"
            id="playBtn"
            type="button"
            aria-label="Play"
          >
            ▶
          </button>

          <button
            class="control-btn"
            id="nextBtn"
            type="button"
            title="Next"
          >
            ⏭
          </button>

          <button
            class="control-btn small"
            id="repeatBtn"
            type="button"
            title="Repeat"
          >
            ↻
          </button>

        </div>


        <!-- Bottom controls -->
        <div class="utility-row">

          <div class="volume-control">
            <span id="volumeIcon">🔊</span>

            <input
              type="range"
              id="volumeBar"
              min="0"
              max="1"
              value="0.8"
              step="0.01"
            />
          </div>

          <div class="speed-control">
            <label for="speedSelect">Speed</label>

            <select id="speedSelect">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </div>

        </div>

      </div>

    </section>


    <!-- Collection -->
    <section class="collection-section">

      <div class="section-heading">

        <div>
          <span class="section-label">COLLECTION</span>
          <h2>Your Tracks</h2>
        </div>

        <span class="track-count" id="trackCount">4 songs</span>

      </div>


      <div class="track-list" id="trackList">
        <!-- JavaScript inserts tracks here -->
      </div>


      <div class="empty-state" id="emptyState">
        <div class="empty-icon">♫</div>
        <h3>No music found</h3>
        <p>Try another search.</p>
      </div>

    </section>

  </main>


  <!-- Floating Mini Player -->
  <div class="mini-player" id="miniPlayer">

    <div class="mini-song">

      <img
        id="miniCover"
        src="assets/images/cover-1.jpg"
        alt="Current song"
      />

      <div>
        <strong id="miniTitle">Golden Hour</strong>
        <span id="miniArtist">Sonora Sessions</span>
      </div>

    </div>


    <div class="mini-center">

      <button id="miniPrev" type="button">⏮</button>

      <button
        class="mini-play"
        id="miniPlay"
        type="button"
      >
        ▶
      </button>

      <button id="miniNext" type="button">⏭</button>

    </div>


    <div class="mini-progress">
      <div id="miniProgress"></div>
    </div>

  </div>


  <!-- Toast -->
  <div class="toast" id="toast">
    <span>✓</span>
    <p id="toastText">Added to favorites</p>
  </div>


  <!-- Audio -->
  <audio id="audioPlayer" preload="metadata"></audio>


  <script src="script.js"></script>

</body>
</html>
